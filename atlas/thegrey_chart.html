<script>
const svg=document.querySelector('svg');const vb0=svg.getAttribute('viewBox').split(' ').map(Number);let vb=[...vb0],drag=null;
const focus={x:862,y:1316};
function apply(){svg.setAttribute('viewBox',vb.join(' '))}
function fitAspect(w){const r=svg.getBoundingClientRect();vb[2]=w;vb[3]=w*r.height/r.width}
function start(){const r=svg.getBoundingClientRect();const w=Math.min(vb0[2],Math.max(900,vb0[2]*0.6));fitAspect(w);vb[0]=focus.x-vb[2]/2;vb[1]=focus.y-vb[3]/2;apply()}
function fit(){const r=svg.getBoundingClientRect();const w=Math.max(vb0[2],vb0[3]*r.width/r.height)*1.04;fitAspect(w);vb[0]=vb0[2]/2-vb[2]/2;vb[1]=vb0[3]/2-vb[3]/2;apply()}
function zoom(k,cx,cy){const r=svg.getBoundingClientRect();const px=vb[0]+cx/r.width*vb[2],py=vb[1]+cy/r.height*vb[3];const w=Math.min(vb0[2]*2,Math.max(300,vb[2]*k));fitAspect(w);vb[0]=px-cx/r.width*vb[2];vb[1]=py-cy/r.height*vb[3];apply()}
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoom(Math.exp(e.deltaY*0.0012),e.clientX-r.left,e.clientY-r.top)},{passive:false});
const info=document.getElementById('info');
function showInfo(el,x,y){const t=el.querySelector('title');if(!t)return false;info.textContent=t.textContent;info.style.display='block';const r=info.getBoundingClientRect();info.style.left=Math.min(x+14,innerWidth-r.width-12)+'px';info.style.top=Math.min(y+14,innerHeight-r.height-12)+'px';return true}
svg.addEventListener('pointerdown',e=>{if(e.target.closest('a'))return;drag={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,target:e.target};svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointerup',e=>{if(drag&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<4){const el=drag.target;let shown=false;for(let n=el;n&&n!==svg;n=n.parentElement){if(n.querySelector&&n.querySelector(':scope>title')){shown=showInfo(n,e.clientX,e.clientY);break}}if(!shown)info.style.display='none'}drag=null});
svg.addEventListener('pointermove',e=>{if(drag&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>=4)info.style.display='none'});
svg.addEventListener('pointermove',e=>{if(!drag)return;const r=svg.getBoundingClientRect();vb[0]-=(e.clientX-drag.x)*vb[2]/r.width;vb[1]-=(e.clientY-drag.y)*vb[3]/r.height;drag={x:e.clientX,y:e.clientY};apply()});
svg.addEventListener('dblclick',start);
document.getElementById('zfit').onclick=fit;document.getElementById('zin').onclick=()=>{const r=svg.getBoundingClientRect();zoom(0.7,r.width/2,r.height/2)};document.getElementById('zout').onclick=()=>{const r=svg.getBoundingClientRect();zoom(1.4,r.width/2,r.height/2)};
addEventListener('resize',()=>{fitAspect(vb[2]);apply()});
start();
</script></body></html>
